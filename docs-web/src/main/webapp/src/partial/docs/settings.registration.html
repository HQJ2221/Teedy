<div class="registration-request">
    <h3>{{ 'settings.registration.title' | translate }}</h3>
    <form ng-submit="submitRequest()">
        <div class="form-group">
            <label>{{ 'settings.registration.username' | translate }}</label>
            <input type="text" ng-model="registration.username" class="form-control" required>
        </div>
        <div class="form-group">
            <label>{{ 'settings.registration.password' | translate }}</label>
            <input type="password" ng-model="registration.password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>{{ 'settings.registration.email' | translate }}</label>
            <input type="email" ng-model="registration.email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">{{ 'submit' | translate }}</button>
    </form>
</div>
